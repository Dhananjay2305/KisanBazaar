<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Delivery Planning - FarmDirect</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <style>
        body, html { height: 100%; margin: 0; overflow: hidden; }
        .admin-layout { display: grid; grid-template-columns: 350px 1fr; height: 100vh; }
        .sidebar { background: white; border-right: 1px solid var(--gray-200); display: flex; flex-direction: column; overflow-y: auto; }
        .sidebar-header { padding: 1.5rem; border-bottom: 1px solid var(--gray-100); }
        .order-list { flex: 1; }
        .order-card { padding: 1rem 1.5rem; border-bottom: 1px solid var(--gray-100); cursor: pointer; transition: background 0.2s; }
        .order-card:hover { background: var(--primary-50); }
        .order-card.active { border-left: 4px solid var(--primary-500); background: var(--primary-50); }
        #adminMap { height: 100%; width: 100%; }
        .badge { padding: 0.25rem 0.5rem; border-radius: 99px; font-size: 0.75rem; font-weight: 600; }
        .badge--pending { background: #fef3c7; color: #92400e; }
        .badge--completed { background: #d1fae5; color: #065f46; }
    </style>
  <link rel="stylesheet" crossorigin href="/assets/style-B74u2jw9.css">
</head>
<body>
    <div class="admin-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                    <h2 style="color: var(--primary-700); margin: 0;">Delivery Radar</h2>
                    <a href="index.html" style="font-size: 0.8rem; color: var(--gray-500);">Logout</a>
                </div>
                <p style="color: var(--gray-500); font-size: 0.9rem; margin: 0;">Planning routes for active orders</p>
            </div>
            <div class="order-list" id="orderList">
                <div style="padding: 2rem; text-align: center; color: var(--gray-400);">
                    <p>Loading orders...</p>
                </div>
            </div>
        </aside>
        <main style="position: relative;">
            <div id="adminMap"></div>
            <div id="mapControls" style="position: absolute; top: 1rem; right: 1rem; z-index: 1000; background: white; padding: 0.75rem; border-radius: 8px; box-shadow: var(--shadow-lg);">
                <button class="btn btn--primary btn--sm" onclick="fetchAllOrders()">🔄 Refresh Data</button>
            </div>
        </main>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
