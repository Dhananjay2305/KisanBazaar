<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Checkout - FarmDirect</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script type="module" crossorigin src="/assets/checkout-Dyq684PF.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/api-7nHHIqDr.js">
  <link rel="modulepreload" crossorigin href="/assets/auth-oH8Wn8sz.js">
  <link rel="modulepreload" crossorigin href="/assets/push-notifications-CQmv0i8S.js">
  <link rel="stylesheet" crossorigin href="/assets/api-D0VKcXqG.css">
</head>

<body class="bg-gray-50">
    <div class="container" style="max-width: 800px; margin: 2rem auto; padding: 0 1rem;">
        <div style="margin-bottom: 2rem;">
            <a href="buyer-dashboard.html#cart"
                style="text-decoration: none; color: var(--gray-600); font-weight: 500;">
                ← Back to Cart
            </a>
            <h1 style="margin-top: 1rem; color: var(--primary-700);">Checkout</h1>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 320px; gap: 2rem;">
            <!-- Left: Payment details -->
            <div>
                <div class="card" style="padding: 2rem; margin-bottom: 2rem;">
                    <h3 style="margin-bottom: 1.5rem;">Select Payment Method</h3>

                    <div class="payment-methods" style="display: flex; flex-direction: column; gap: 1rem;">
                        <label class="card"
                            style="padding: 1rem; cursor: pointer; display: flex; align-items: center; gap: 1rem; border: 2px solid var(--gray-200);">
                            <input type="radio" name="paymentMethod" value="UPI" checked
                                onclick="togglePaymentFields('upi')">
                            <div style="flex: 1;">
                                <strong>UPI</strong>
                                <p style="font-size: 0.8rem; color: var(--gray-500); margin: 0;">Google Pay, PhonePe,
                                    Paytm</p>
                            </div>
                            <span style="font-size: 1.5rem;">📱</span>
                        </label>

                        <label class="card"
                            style="padding: 1rem; cursor: pointer; display: flex; align-items: center; gap: 1rem; border: 2px solid var(--gray-200);">
                            <input type="radio" name="paymentMethod" value="Card" onclick="togglePaymentFields('card')">
                            <div style="flex: 1;">
                                <strong>Credit / Debit Card</strong>
                                <p style="font-size: 0.8rem; color: var(--gray-500); margin: 0;">Visa, Mastercard, RuPay
                                </p>
                            </div>
                            <span style="font-size: 1.5rem;">💳</span>
                        </label>

                        <label class="card"
                            style="padding: 1rem; cursor: pointer; display: flex; align-items: center; gap: 1rem; border: 2px solid var(--gray-200);">
                            <input type="radio" name="paymentMethod" value="Net Banking"
                                onclick="togglePaymentFields('netbanking')">
                            <div style="flex: 1;">
                                <strong>Net Banking</strong>
                                <p style="font-size: 0.8rem; color: var(--gray-500); margin: 0;">All major Indian banks
                                </p>
                            </div>
                            <span style="font-size: 1.5rem;">🏦</span>
                        </label>

                        <label class="card"
                            style="padding: 1rem; cursor: pointer; display: flex; align-items: center; gap: 1rem; border: 2px solid var(--gray-200);">
                            <input type="radio" name="paymentMethod" value="Cash on Delivery"
                                onclick="togglePaymentFields('cod')">
                            <div style="flex: 1;">
                                <strong>Cash on Delivery</strong>
                                <p style="font-size: 0.8rem; color: var(--gray-500); margin: 0;">Pay when you receive
                                    the items</p>
                            </div>
                            <span style="font-size: 1.5rem;">💵</span>
                        </label>
                    </div>

                    <!-- Payment Details Fields -->
                    <div id="paymentDetails"
                        style="margin-top: 2rem; padding-top: 2rem; border-top: 1px solid var(--gray-200);">
                        <!-- UPI Fields -->
                        <div id="upiFields">
                            <div class="form-group">
                                <label class="form-label">UPI ID</label>
                                <input type="text" class="form-input" id="upiId" placeholder="username@upi">
                            </div>
                        </div>

                        <!-- Card Fields -->
                        <div id="cardFields" style="display: none;">
                            <div class="form-group">
                                <label class="form-label">Card Holder Name</label>
                                <input type="text" class="form-input" id="cardName" placeholder="Full Name">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Card Number</label>
                                <input type="text" class="form-input" id="cardNumber" placeholder="0000 0000 0000 0000">
                            </div>
                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                                <div class="form-group">
                                    <label class="form-label">Expiry (MM/YY)</label>
                                    <input type="text" class="form-input" id="cardExpiry" placeholder="MM/YY">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">CVV</label>
                                    <input type="password" class="form-input" id="cardCvv" placeholder="123">
                                </div>
                            </div>
                        </div>

                        <!-- Net Banking Fields -->
                        <div id="netbankingFields" style="display: none;">
                            <div class="form-group">
                                <label class="form-label">Select Bank</label>
                                <select class="form-select" id="bankName">
                                    <option value="">Choose your bank</option>
                                    <option value="sbi">State Bank of India</option>
                                    <option value="hdfc">HDFC Bank</option>
                                    <option value="icici">ICICI Bank</option>
                                    <option value="axis">Axis Bank</option>
                                </select>
                            </div>
                        </div>

                        <!-- COD Message -->
                        <div id="codFields" style="display: none;">
                            <p style="color: var(--gray-600);">No payment info required for COD. Click "Confirm Order"
                                below.</p>
                        </div>
                    </div>
                </div>

                <div class="card" style="padding: 2rem;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                        <h3 style="margin: 0;">Shipping Address</h3>
                        <button class="btn btn--outline btn--sm" onclick="detectLocation()" type="button" style="padding: 0.5rem 1rem;">
                            📍 Detect My Location
                        </button>
                    </div>
                    <div class="form-group">
                        <textarea class="form-textarea" id="shippingAddress" rows="3"
                            placeholder="Enter your full delivery address..." required></textarea>
                    </div>
                    <div id="locationStatus" style="font-size: 0.85rem; color: var(--gray-600); margin-top: 0.5rem; display: none;"></div>
                    <div id="map" style="height: 250px; border-radius: 8px; margin-top: 1rem; border: 1px solid var(--gray-200); display: none;"></div>
                </div>
            </div>

            <!-- Right: Order Summary -->
            <div>
                <div class="card" style="padding: 1.5rem; position: sticky; top: 2rem;">
                    <h3 style="margin-bottom: 1.5rem;">Order Summary</h3>
                    <div id="checkoutItems" style="margin-bottom: 1.5rem;">
                        <!-- Items will be loaded here -->
                    </div>

                    <div style="border-top: 1px solid var(--gray-200); padding-top: 1rem; margin-bottom: 1.5rem;">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                            <span style="color: var(--gray-600);">Subtotal</span>
                            <span id="subtotal">₹0</span>
                        </div>
                        <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                            <span style="color: var(--gray-600);">Delivery Distance</span>
                            <span id="deliveryDistance">0 km</span>
                        </div>
                        <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                            <span style="color: var(--gray-600);">Delivery Fee</span>
                            <span id="deliveryFee">₹0</span>
                        </div>
                        <div
                            style="display: flex; justify-content: space-between; margin-top: 1rem; font-size: 1.25rem; font-weight: 700;">
                            <span>Total</span>
                            <span class="text-primary" id="finalTotal">₹0</span>
                        </div>
                    </div>

                    <button class="btn btn--primary btn--full btn--lg" id="payBtn" onclick="handlePayment()">
                        🔒 Secure Pay
                    </button>
                    <p style="margin-top: 1rem; text-align: center; color: var(--gray-500); font-size: 0.8rem;">
                        Your data is encrypted and secure.
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

</body>

</html>
