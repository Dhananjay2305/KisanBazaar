<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - FarmDirect</title>
    <meta name="description" content="Secure admin login for FarmDirect management panel.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script type="module" crossorigin src="/assets/adminLogin-B2oT6ghb.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/api-7nHHIqDr.js">
  <link rel="modulepreload" crossorigin href="/assets/push-notifications-CQmv0i8S.js">
  <link rel="stylesheet" crossorigin href="/assets/api-D0VKcXqG.css">
</head>
<body class="admin-login-page">

    <!-- Floating particles background -->
    <div style="position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;">
        <div style="position:absolute;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(34,197,94,0.08),transparent);top:-100px;right:-100px;"></div>
        <div style="position:absolute;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(59,130,246,0.06),transparent);bottom:-50px;left:-80px;"></div>
    </div>

    <div class="admin-login-card" style="position:relative;z-index:1;">
        <!-- Logo -->
        <div style="display:flex;align-items:center;gap:0.75rem;margin-bottom:2rem;">
            <div style="width:44px;height:44px;background:linear-gradient(135deg,#22c55e,#16a34a);border-radius:12px;display:flex;align-items:center;justify-content:center;">
                <i class="fa-solid fa-leaf" style="color:#fff;font-size:1.25rem;"></i>
            </div>
            <span style="color:#fff;font-family:'Outfit',sans-serif;font-size:1.4rem;font-weight:700;">FarmDirect</span>
        </div>

        <h1>Admin Panel</h1>
        <p>Sign in with your administrator credentials to continue.</p>

        <!-- Error Alert -->
        <div id="errorAlert" style="display:none;background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.3);border-radius:10px;padding:0.875rem 1rem;margin-bottom:1.5rem;color:#fca5a5;font-size:0.9rem;">
            <i class="fa-solid fa-circle-exclamation" style="margin-right:0.5rem;"></i>
            <span id="errorText"></span>
        </div>

        <form id="adminLoginForm">
            <div class="form-group">
                <label class="form-label" for="adminPhone">Phone Number</label>
                <input
                    type="tel"
                    id="adminPhone"
                    class="form-input"
                    placeholder="Enter your phone number"
                    required
                    autocomplete="username"
                >
            </div>
            <div class="form-group">
                <label class="form-label" for="adminPassword">Password</label>
                <div style="position:relative;">
                    <input
                        type="password"
                        id="adminPassword"
                        class="form-input"
                        placeholder="Enter your password"
                        required
                        autocomplete="current-password"
                        style="padding-right:3rem;"
                    >
                    <button
                        type="button"
                        onclick="togglePassword()"
                        style="position:absolute;right:0.875rem;top:50%;transform:translateY(-50%);background:none;border:none;color:#6b7280;cursor:pointer;font-size:1rem;"
                        id="toggleBtn"
                    ><i class="fa-solid fa-eye"></i></button>
                </div>
            </div>

            <button
                type="submit"
                class="btn btn--primary"
                id="loginBtn"
                style="width:100%;margin-top:0.5rem;padding:0.875rem;font-size:1rem;"
            >
                <span class="btn-text">Sign In to Admin Panel</span>
            </button>
        </form>

        <p style="margin-top:2rem;text-align:center;color:#4b5563;font-size:0.875rem;">
            Not an admin?
            <a href="auth.html" style="color:#22c55e;font-weight:500;">Go to User Login</a>
        </p>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

</body>
</html>
