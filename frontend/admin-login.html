<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - FarmDirect</title>
    <meta name="description" content="Secure admin login for FarmDirect management panel.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="admin-login-page">

    <!-- Floating particles background -->
    <div style="position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;">
        <div style="position:absolute;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(34,197,94,0.08),transparent);top:-100px;right:-100px;"></div>
        <div style="position:absolute;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(59,130,246,0.06),transparent);bottom:-50px;left:-80px;"></div>
    </div>

    <div class="admin-login-card" style="position:relative;z-index:1;">
        <!-- Logo -->
        <div style="display:flex;align-items:center;gap:0.75rem;margin-bottom:2rem;">
            <div style="width:44px;height:44px;background:linear-gradient(135deg,#22c55e,#16a34a);border-radius:12px;display:flex;align-items:center;justify-content:center;">
                <i class="fa-solid fa-leaf" style="color:#fff;font-size:1.25rem;"></i>
            </div>
            <span style="color:#fff;font-family:'Outfit',sans-serif;font-size:1.4rem;font-weight:700;">FarmDirect</span>
        </div>

        <h1>Admin Panel</h1>
        <p>Sign in with your administrator credentials to continue.</p>

        <!-- Error Alert -->
        <div id="errorAlert" style="display:none;background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.3);border-radius:10px;padding:0.875rem 1rem;margin-bottom:1.5rem;color:#fca5a5;font-size:0.9rem;">
            <i class="fa-solid fa-circle-exclamation" style="margin-right:0.5rem;"></i>
            <span id="errorText"></span>
        </div>

        <form id="adminLoginForm">
            <div class="form-group">
                <label class="form-label" for="adminPhone">Phone Number</label>
                <input
                    type="tel"
                    id="adminPhone"
                    class="form-input"
                    placeholder="Enter your phone number"
                    required
                    autocomplete="username"
                >
            </div>
            <div class="form-group">
                <label class="form-label" for="adminPassword">Password</label>
                <div style="position:relative;">
                    <input
                        type="password"
                        id="adminPassword"
                        class="form-input"
                        placeholder="Enter your password"
                        required
                        autocomplete="current-password"
                        style="padding-right:3rem;"
                    >
                    <button
                        type="button"
                        onclick="togglePassword()"
                        style="position:absolute;right:0.875rem;top:50%;transform:translateY(-50%);background:none;border:none;color:#6b7280;cursor:pointer;font-size:1rem;"
                        id="toggleBtn"
                    ><i class="fa-solid fa-eye"></i></button>
                </div>
            </div>

            <button
                type="submit"
                class="btn btn--primary"
                id="loginBtn"
                style="width:100%;margin-top:0.5rem;padding:0.875rem;font-size:1rem;"
            >
                <span class="btn-text">Sign In to Admin Panel</span>
            </button>
        </form>

        <p style="margin-top:2rem;text-align:center;color:#4b5563;font-size:0.875rem;">
            Not an admin?
            <a href="auth.html" style="color:#22c55e;font-weight:500;">Go to User Login</a>
        </p>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script type="module">
        import { supabase } from './js/supabase-client.js';
        import { showToast } from './js/api.js';

        function showError(msg) {
            const alert = document.getElementById('errorAlert');
            document.getElementById('errorText').textContent = msg;
            alert.style.display = 'block';
        }

        function hideError() {
            document.getElementById('errorAlert').style.display = 'none';
        }

        window.togglePassword = function() {
            const input = document.getElementById('adminPassword');
            const btn = document.getElementById('toggleBtn');
            if (input.type === 'password') {
                input.type = 'text';
                btn.innerHTML = '<i class="fa-solid fa-eye-slash"></i>';
            } else {
                input.type = 'password';
                btn.innerHTML = '<i class="fa-solid fa-eye"></i>';
            }
        };

        document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();

            const phone = document.getElementById('adminPhone').value.trim();
            const password = document.getElementById('adminPassword').value;
            const btn = document.getElementById('loginBtn');
            const btnText = btn.querySelector('.btn-text') || btn;

            if (!phone || !password) {
                showError('Please fill in all fields.');
                return;
            }

            btn.disabled = true;
            btnText.innerHTML = '<span class="loading-spinner"></span> Signing in...';

            try {
                const email = `${phone}@farmdirect.com`;
                const { data, error } = await supabase.auth.signInWithPassword({ email, password });

                if (error) throw error;

                // Fetch profile and verify admin role
                const { data: profile, error: pError } = await supabase
                    .from('profiles')
                    .select('*')
                    .eq('id', data.user.id)
                    .single();

                if (pError) throw pError;

                if (profile.role !== 'admin') {
                    await supabase.auth.signOut();
                    showError('Access denied. You do not have admin privileges.');
                    return;
                }

                // Save session
                localStorage.setItem('token', data.session.access_token);
                localStorage.setItem('user', JSON.stringify(profile));

                showToast('Welcome back, Admin!', 'success');
                setTimeout(() => {
                    window.location.href = 'admin.html';
                }, 600);

            } catch (err) {
                showError(err.message || 'Login failed. Please check your credentials.');
            } finally {
                btn.disabled = false;
                btnText.textContent = 'Sign In to Admin Panel';
            }
        });

        // Auto-redirect if already logged in as admin
        (async () => {
            try {
                const { data: { session } } = await supabase.auth.getSession();
                if (!session) return;
                const { data: profile } = await supabase.from('profiles').select('role').eq('id', session.user.id).single();
                if (profile?.role === 'admin') {
                    localStorage.setItem('token', session.access_token);
                    localStorage.setItem('user', JSON.stringify(profile));
                    window.location.href = 'admin.html';
                }
            } catch (_) {}
        })();
    </script>
<script type="module" src="js/splash-back.js"></script>
<script type="module" src="/js/push-notifications.js"></script>
</body>
</html>
